name: Release & Publish Docker Package

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag atau Versi yang akan dirilis/dibuild (contoh: v1.2.0)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}
      is_prerelease: ${{ steps.determine_type.outputs.is_prerelease }}
      make_latest: ${{ steps.determine_type.outputs.make_latest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve Target Tag
        id: resolve_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Target Tag: ${TAG}"

      - name: Determine Release Type (Latest vs Pre-release)
        id: determine_type
        shell: bash
        run: |
          TAG="${{ steps.resolve_tag.outputs.tag }}"
          CLEAN_VERSION="${TAG#v}"
          echo "Processing tag: $TAG (version: $CLEAN_VERSION)"

          # Parse Major, Minor, Patch
          IFS='.' read -r MAJOR MINOR PATCH_RAW <<< "$CLEAN_VERSION"
          PATCH=$(echo "$PATCH_RAW" | grep -oE '^[0-9]+' || echo "0")

          if [ "$PATCH" != "0" ] || [[ "$PATCH_RAW" =~ [^0-9] ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT
            echo "### Release Type: Pre-release" >> $GITHUB_STEP_SUMMARY
            echo "Tag ini ($TAG) diklasifikasikan sebagai Pre-release." >> $GITHUB_STEP_SUMMARY
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
            echo "### Release Type: Latest Production Release" >> $GITHUB_STEP_SUMMARY
            echo "Tag ini ($TAG) diklasifikasikan sebagai Latest Release." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Extract Changelog Section
        id: changelog
        shell: bash
        run: |
          node scripts/extract-changelog.mjs "${{ steps.resolve_tag.outputs.tag }}"
          if [ -f release_body.md ]; then
            echo "has_custom_body=true" >> $GITHUB_OUTPUT
          else
            echo "has_custom_body=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: HubbHQ ${{ steps.resolve_tag.outputs.tag }}
          prerelease: ${{ steps.determine_type.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.determine_type.outputs.make_latest }}
          generate_release_notes: true
          body_path: ${{ steps.changelog.outputs.has_custom_body == 'true' && 'release_body.md' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Push Docker Image to GitHub Packages (GHCR)
    runs-on: ubuntu-latest
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag || github.event.inputs.tag_name || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag || github.event.inputs.tag_name || github.ref_name }}
            type=raw,value=latest,enable=${{ needs.release.outputs.make_latest == 'true' }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
